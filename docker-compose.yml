name: aadharshila
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aadharshila
      POSTGRES_PASSWORD: aadharshila_dev
      POSTGRES_DB: aadharshila
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aadharshila -d aadharshila"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - documents:/app/var/documents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
  worker:
    build: .
    command: ["python", "-m", "aadharshila.worker"]
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - documents:/app/var/documents
volumes:
  pgdata:
  documents:
