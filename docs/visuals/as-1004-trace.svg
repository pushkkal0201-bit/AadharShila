<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 344" role="img" aria-labelledby="trace-title trace-desc">
<title id="trace-title">Synthetic application AS-1004 decision and replay</title>
<desc id="trace-desc">Bank income 100,000 rupees, supporting income 55,000 rupees, 45 percent difference compared with an illustrative 15 percent limit. The result is refer. After evidence correction the old assessment can still be replayed.</desc>
<style><![CDATA[
 .frame{fill:#ffffff;stroke:#dce7ee;stroke-width:1.4}
 .node{animation:focus 8s ease-in-out infinite}
 .two{animation-delay:2s}.three{animation-delay:4s}.four{animation-delay:6s}
 .marker{animation:progress 8s ease-in-out infinite}
 @keyframes focus{0%,6%,29%,100%{opacity:.65} 10%,24%{opacity:1}}
 @keyframes progress{0%,7%{transform:translateX(0);opacity:0} 12%{opacity:1} 90%{transform:translateX(855px);opacity:1} 100%{transform:translateX(855px);opacity:0}}
 @media(prefers-reduced-motion: reduce){.node,.marker{animation:none;opacity:1}}
]]></style>
<rect width="1200" height="344" rx="14" fill="#f3f7fa"/>
<rect x="19" y="18" width="1162" height="308" rx="11" fill="#ffffff" stroke="#dce7ee"/>
<text x="49" y="52" fill="#2c5264" font-family="Segoe UI,Arial,sans-serif" font-weight="700" letter-spacing="2" font-size="13">AS-1004 / HOW A REFER HAPPENS</text>
<text x="49" y="78" fill="#667f8d" font-family="Segoe UI,Arial,sans-serif" font-size="14">Illustrative Loan Against Property case · local fixtures only</text>
<path d="M159 108H1027" fill="none" stroke="#d1dee6" stroke-width="3" stroke-linecap="round"/>
<circle class="marker" cx="161" cy="108" r="8" fill="#16ad94"/>
<g class="node">
  <rect class="frame" x="47" y="129" width="268" height="133" rx="11"/>
  <rect x="47" y="129" width="268" height="5" rx="2.5" fill="#347c92"/>
  <text x="66" y="158" fill="#738996" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">01 / EVIDENCE</text>
  <text x="66" y="188" fill="#132c39" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Bank: &#8377;1,00,000</text>
  <text x="66" y="217" fill="#3d5d6c" font-family="Segoe UI,Arial,sans-serif" font-size="18">Support: &#8377;55,000</text>
  <text x="66" y="245" fill="#6c8490" font-family="Segoe UI,Arial,sans-serif" font-size="12">Two different income assertions</text>
</g>
<g class="node two">
  <rect class="frame" x="335" y="129" width="255" height="133" rx="11"/>
  <rect x="335" y="129" width="255" height="5" rx="2.5" fill="#db9e38"/>
  <text x="354" y="158" fill="#738996" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">02 / CONTRADICTION</text>
  <text x="354" y="196" fill="#a66b14" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">45% mismatch</text>
  <text x="354" y="225" fill="#566d7c" font-family="Segoe UI,Arial,sans-serif" font-size="14">Tolerance: 15%</text>
  <text x="354" y="245" fill="#6c8490" font-family="Segoe UI,Arial,sans-serif" font-size="12">Exceeds synthetic policy limit</text>
</g>
<g class="node three">
  <rect class="frame" x="610" y="129" width="255" height="133" rx="11"/>
  <rect x="610" y="129" width="255" height="5" rx="2.5" fill="#d88d29"/>
  <text x="629" y="158" fill="#738996" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">03 / DECISION</text>
  <rect x="628" y="173" width="101" height="35" rx="7" fill="#fff1d8"/>
  <text x="678" y="196" text-anchor="middle" fill="#95550c" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">REFER</text>
  <text x="628" y="231" fill="#3d5d6c" font-family="Segoe UI,Arial,sans-serif" font-size="12">INCOME_CONTRADICTION</text>
  <text x="628" y="247" fill="#6c8490" font-family="Segoe UI,Arial,sans-serif" font-size="12">Review required, not an approval</text>
</g>
<g class="node four">
  <rect class="frame" x="885" y="129" width="268" height="133" rx="11"/>
  <rect x="885" y="129" width="268" height="5" rx="2.5" fill="#16ad94"/>
  <text x="904" y="158" fill="#738996" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">04 / REVISE + REPLAY</text>
  <text x="904" y="190" fill="#132c39" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Support: &#8377;99,000</text>
  <text x="904" y="219" fill="#3d5d6c" font-family="Segoe UI,Arial,sans-serif" font-size="14">New evidence revision</text>
  <text x="904" y="243" fill="#6c8490" font-family="Segoe UI,Arial,sans-serif" font-size="12">Original assessment still replays</text>
</g>
<text x="50" y="299" fill="#5e7885" font-family="Segoe UI,Arial,sans-serif" font-size="13">The correction creates a new assessment; it does not guarantee a different final decision.</text>
</svg>