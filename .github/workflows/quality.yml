name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies and research extras
        run: |
          python -m pip install -r requirements-ml.txt
          python -m pip install --no-deps -e .
      - name: Verify decisions, privacy, connectors, model evaluation and recovery
        run: python -m pytest -q
        env:
          APP_ENV: development
          SEED_DEMO: 'true'
      - name: Check browser JavaScript syntax
        run: node --check web/app.js

  docker-postgres-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated development configuration
        run: |
          cp .env.example .env
          echo 'SESSION_SECRET=ci-test-random-example-not-for-any-real-deployment-6384' >> .env
      - name: Build and run PostgreSQL API + worker
        run: docker compose up -d --build --wait
      - name: API health and database population
        run: |
          set -euo pipefail
          curl --fail --retry 20 --retry-delay 3 --retry-connrefused http://127.0.0.1:8000/health/ready
          test "$(docker compose exec -T db psql -U aadharshila -d aadharshila -At -c 'SELECT count(*) FROM applications')" -ge 16
      - name: Actual PostgreSQL and document-volume backup + restore drill
        run: |
          bash scripts/docker_backup.sh "$RUNNER_TEMP/aadharshila-ci-backup"
          bash scripts/docker_restore_drill.sh "$RUNNER_TEMP/aadharshila-ci-backup"
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Shutdown and remove CI volumes
        if: always()
        run: docker compose down --volumes --remove-orphans || true
